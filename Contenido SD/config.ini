# ============================================================
# 🕹️ RETRO PIXEL LED LITE - CONFIGURATION v3.1.4
# ============================================================
# Note: Do not put spaces around the '=' symbol.
# Correct example: BRIGHTNESS=40

[WIFI_NTP]
# Configure your Wi-Fi network
WIFI_ENABLE=1
SSID=YOUR_WIFI_NAME
PASS=YOUR_WIFI_PASSWORD
# Show the IP address at startup
MOSTRAR_IP=0
# Configure your time zone
TZ=CET-1CEST,M3.5.0,M10.5.0/3

[HARDWARE]
# Number of panels in the chain
PANEL_CHAIN=2
# Panel color order: RGB, RBG, or GBR
COLOR_ORDER=RGB
# Brightness (0 to 255)
BRIGHTNESS=38
# I2S speed: 0=8MHz, 1=10MHz, 2=16MHz, 3=20MHz (Turbo)
I2S_SPEED=2
# Minimum refresh rate (Hz): 30 to 120
REFRESH_MIN=120
# Double buffering: 0=OFF, 1=ON (reduces flicker)
DOUBLE_BUFF=0
# Anti-ghosting: 1 to 4 (increase if ghosting is visible)
LATCH_BLANK=1
# SD clock speed (MHz): 4, 10, 20, or 25. Lower it if playback stutters or read errors occur
SD_SPEED=10

[LOGIC]
# Display mode: 0=GIFs, 1=Clock only
PLAY_MODE=0
# Enable or disable app configuration: 0=OFF, 1=ON (requires Wi-Fi)
CONFI_APP_ENABLE=1
# Select your Arcade system: 0=OFF, 1=Batocera, 2=Recalbox, 3=ReplayOS, 4=RetroBat
ARCADE_ENABLE=0
# Enable or disable scrolling text: 0=OFF, 1=ON (requires Wi-Fi)
TEXT_ENABLE=1
# Enable or disable the clock: 0=OFF, 1=ON (requires Wi-Fi)
CLOCK_ENABLE=1
# Playback mode: 0=Sequential, 1=Random
RANDOM_MODE=1
# Interval: show the clock after this many GIFs
AUTO_CLOCK_INT=6
# Duration: number of seconds to show the clock
CLOCK_DURATION=10
# Styles: 0=Solid, 1=Aurora, 2=Rainbow, 3=Gradient, 4=Fire, 5=Glitch
CLOCK_STYLE=2
# Enable the particle-explosion transition from clock to GIFs: 0=OFF, 1=ON
TRANSITION_ENABLE=1
# Clock color (0=White, 1=Red, 2=Green, 3=Blue, 4=Yellow, 5=Cyan, 6=Magenta, 7=Orange, 8=Pink)
CLOCK_COLOR=4

[WEATHER]
# Enable weather: 0=OFF, 1=ON (requires Wi-Fi)
WEATHER_ENABLE=1
# Your city (no spaces; use '+' if needed, e.g. Madrid,ES or Buenos+Aires,AR)
CITY=Navalmoral+de+la+Mata,ES
# Your free OpenWeatherMap API key
API_KEY=xxxxxxxxxxxxxxxxxxxxxxx
# Weather update interval in MINUTES
WEATHER_INT=60
# Text displayed above the clock
WEATHER_MSG=Game Room

[LANGUAGE]
# Language (filename without .json: ES, EN, FR, ...)
LANGUAGE=ES

[IR_REMOTE]
# IR remote HEX codes (leave as-is; Retro Pixel LED saves them automatically)
BTN_ON=F20DFF00
BTN_OFF=E01FFF00
BTN_BRILLO_UP=F609FF00
BTN_BRILLO_DOWN=E21DFF00
BTN_MENU=EA15FF00
BTN_OK=ED12FF00
BTN_SUBIR=E41BFF00
BTN_BAJAR=B34CFF00

[REPLAY_OS]
# IP address assigned to ReplayOS
IP=192.168.1.101
# ReplayOS token: SYSTEM > INFORMATION > NET CONTROL CODE
TOKEN=

[END]
